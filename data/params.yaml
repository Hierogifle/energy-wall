# Configuration Monte Carlo + tornado : lois triangulaire(low, central, high) ou uniforme(low, high).
monte_carlo:
  n_tirages: 10000
  graine: 20261014
  loi: triangulaire  # triangulaire | uniforme
  quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
  pas_elasticite: 0.1

# Stress test « miracle » : bracket du solveur sur T_d_parc (jamais T -> 0 : débordement de
# 2^(n/T)) et zones de lecture selon la pointe du matériel (Epoch). La cible IEA est lue dans cibles_iea.
miracle:
  bracket_T_d: [0.3, 100]
  pointe_epoch:
    low:
      {valeur: 1.7, statut: S, source_ids: [epoch], justification: "Pointe du matériel, valeurs divergentes selon les versions [S] ; le parc est plus lent (renouvellement 3-6 ans)."}
    high:
      {valeur: 3.0, statut: S, source_ids: [epoch], justification: "Pointe du matériel, valeurs divergentes selon les versions [S] ; le parc est plus lent (renouvellement 3-6 ans)."}

# Points IEA de comparaison (affichés, jamais forcés).
cibles_iea:
  - {annee: 2030, scenario: base, cas_iea: "Base", valeur: 945, unite: TWh, statut: V, source_ids: [iea_energy_ai_2025], note: "Contrôle de validation, non utilisé pour le calage."}
  - {annee: 2035, scenario: optimiste, cas_iea: "Headwinds", valeur: 700, unite: TWh, statut: V, source_ids: [iea_energy_ai_2025], note: "Plateau ~700 TWh."}
  - {annee: 2035, scenario: normal, cas_iea: "Base", valeur: 1200, unite: TWh, statut: V, source_ids: [iea_energy_ai_2025], note: "~1 200 TWh."}
  - {annee: 2035, scenario: pessimiste, cas_iea: "Lift-Off", valeur: 1700, unite: TWh, statut: V, source_ids: [iea_energy_ai_2025], note: "Plancher (>1 700 TWh)."}


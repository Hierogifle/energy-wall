      {valeur: 2.2, statut: H, source_ids: [openrouter], justification: "Contexte : OpenRouter (tokens quotidiens, relais, échantillon d'utilisateurs, profondeur historique non vérifiée) ; aucune série lue. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}


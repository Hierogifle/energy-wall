# Paramètres du modèle. Statut PAR BORNE : V = lu à la source, S = via relais,
# D = dérivé d'une source (justification obligatoire), H = hypothèse (justification obligatoire).
# source_ids d'une borne H = contexte de lecture, jamais une dérivation.
# Les entrées du contrôle bottom-up (C_train_2024, N_act, Tokens_2024, eff_eff) sont hors scénarios.
params:
  E_DC0:
    unite: TWh
    description: "Consommation électrique totale des datacenters, monde, 2024 (ancrage du modèle)"
    low:
      {valeur: 415, statut: V, source_ids: [iea_energy_ai_2025], justification: ""}
    central:
      {valeur: 415, statut: V, source_ids: [iea_energy_ai_2025], justification: ""}
    high:
      {valeur: 415, statut: V, source_ids: [iea_energy_ai_2025], justification: ""}

  s_AI:
    unite: "-"
    description: "Part de l'IA dans la consommation des datacenters en 2024 (figée au central dans les scénarios)"
    low:
      valeur: 0.05
      statut: D
      source_ids: [iea4e_2025]
      justification: "Bas de la fourchette « 5-15 % of global data centre energy use in 2023 » de la littérature (IEA-4E 2025, p. vi, lu [V]) ; année 2023 appliquée à 2024 (dérivation). Valeur inchangée par rapport à l'hypothèse antérieure (choix de modélisation antérieur) ; les auteurs eux-mêmes donnent 10-15 % (p. 43)."
    central:
      valeur: 0.15
      statut: H
      source_ids: []
      justification: "Aucune source : valeur choisie entre la borne basse H (0,05) et la borne haute D (0,28), sans mesure."
    high:
      valeur: 0.28
      statut: D
      source_ids: [nature_2026]
      justification: "~118 TWh d'IA en 2024 (revue Nature, paywall non lu, statut S) / 415 TWh (IEA) = 0,284, arrondi à 0,28. Deux sources de périmètres différents."

  s_train:
    unite: "-"
    description: "Part de l'entraînement dans la consommation IA en 2024 (figée au central dans les scénarios)"
    low:
      {valeur: 0.2, statut: D, source_ids: [iea4e_2025], justification: "Bas de « training... around 20-40% of overall ML-related energy use » (IEA-4E 2025, p. 29, lu) ; données Meta/Google d'années <= 2022 (statut S pour elles), appliquées au monde 2024 = dérivation."}
    central:
      {valeur: 0.35, statut: H, source_ids: [iea4e_2025], justification: "Valeur centrale H conservée (0,35, non centrée : le milieu de 20-40 % serait 0,30) pour ne pas modifier les scénarios déjà livrés ; elle reste dans la fourchette de l'IEA-4E 2025 (p. 29) ; choix de notre part, ce n'est pas une mesure."}
    high:
      {valeur: 0.4, statut: D, source_ids: [iea4e_2025], justification: "Haut de « training... around 20-40% of overall ML-related energy use » (IEA-4E 2025, p. 29, lu) ; données Meta/Google d'années <= 2022, appliquées au monde 2024 = dérivation. Remplace l'ancienne borne H 0,50, qui dépassait la fourchette."}

  PUE_2024:
    unite: "-"
    description: "PUE moyen du parc en 2024 (figé au central dans les scénarios)"
    low:
      valeur: 1.2
      statut: D
      source_ids: [morrison_2025]
      justification: "Deux clusters de recherche, PUE fournis par les hébergeurs (déclaratif) : Jupiter (Texas) entre 1,1 et 1,2, retenu 1,2 ; Augusta (Iowa) 1,12 en moyenne glissante 12 mois ; pas une moyenne hyperscale ni du parc ; 1,2 retenu."
    central:
      valeur: 1.4
      statut: H
      source_ids: []
      justification: "Absent des refs ; valeur choisie entre la borne basse (clusters de recherche) et la borne haute (moyenne Uptime)."
    high:
      valeur: 1.56
      statut: S
      source_ids: [uptime]
      justification: "PUE 2024 d'Uptime, lu via un relais (mgrid) ; déclaratif (PUE du plus grand site de chaque répondant, non mesuré)."

  g_conv:
    unite: taux/an
    description: "Croissance annuelle de l'énergie du non-IA (taux, facteur = 1 + g)"
    low:
      {valeur: 0.02, statut: H, source_ids: [iea_energy_ai_2025], justification: "Contexte : l'IEA donne +9 %/an pour les serveurs classiques en CAPACITÉ, pas en énergie ; la plage 2-4 % est sous cette valeur et n'en est pas dérivée. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    central:
      {valeur: 0.03, statut: H, source_ids: [iea_energy_ai_2025], justification: "Contexte : l'IEA donne +9 %/an pour les serveurs classiques en CAPACITÉ, pas en énergie ; la plage 2-4 % est sous cette valeur et n'en est pas dérivée. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    high:
      {valeur: 0.04, statut: H, source_ids: [iea_energy_ai_2025], justification: "Contexte : l'IEA donne +9 %/an pour les serveurs classiques en CAPACITÉ, pas en énergie ; la plage 2-4 % est sous cette valeur et n'en est pas dérivée. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}

  g_Ctrain_2025:
    unite: facteur/an
    description: "Facteur annuel de croissance du compute d'entraînement agrégé, étape 2024-2025"
    low:
      {valeur: 1.6, statut: H, source_ids: [epoch], justification: "Contexte : Epoch donne ~4-5x/an pour les modèles de pointe, ≠ total industrie ; la plage 1,6-1,9 n'en est pas dérivée. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    central:
      {valeur: 1.8, statut: H, source_ids: [epoch], justification: "Contexte : Epoch donne ~4-5x/an pour les modèles de pointe, ≠ total industrie ; la plage 1,6-1,9 n'en est pas dérivée. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    high:
      {valeur: 1.9, statut: H, source_ids: [epoch], justification: "Contexte : Epoch donne ~4-5x/an pour les modèles de pointe, ≠ total industrie ; la plage 1,6-1,9 n'en est pas dérivée. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}

  g_Ctrain_2035:
    unite: facteur/an
    description: "Facteur annuel de croissance du compute d'entraînement agrégé, étape 2034-2035"
    low:
      {valeur: 1.15, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    central:
      {valeur: 1.2, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    high:
      {valeur: 1.25, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}

  g_tok_2025:
    unite: facteur/an
    description: "Facteur annuel de croissance du volume de tokens servis, étape 2024-2025"
    low:
      {valeur: 1.9, statut: H, source_ids: [openrouter], justification: "Contexte : OpenRouter (tokens quotidiens, relais, échantillon d'utilisateurs, profondeur historique non vérifiée) ; aucune série lue. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    central:
      {valeur: 2.0, statut: H, source_ids: [openrouter], justification: "Contexte : OpenRouter (tokens quotidiens, relais, échantillon d'utilisateurs, profondeur historique non vérifiée) ; aucune série lue. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}

    central:
      {valeur: 5.0e+26, statut: H, source_ids: [kaplan_2020, hoffmann_2022], justification: "Ordre de grandeur choisi par nous ; relations 6ND/2N revérifiées dans Kaplan [V, ar5iv] ; « 20 tokens par paramètre » (Hoffmann) non énoncé tel quel et pertinence pour modèles à experts [NT] ; ce n'est pas une mesure."}
    high:
      {valeur: 2.0e+27, statut: H, source_ids: [kaplan_2020, hoffmann_2022], justification: "Ordre de grandeur choisi par nous ; relations 6ND/2N revérifiées dans Kaplan [V, ar5iv] ; « 20 tokens par paramètre » (Hoffmann) non énoncé tel quel et pertinence pour modèles à experts [NT] ; ce n'est pas une mesure."}

  N_act:
    unite: paramètres
    description: "Paramètres actifs moyens des modèles servis en 2024 (contrôle bottom-up)"
    low:
      {valeur: 3.0e+10, statut: H, source_ids: [kaplan_2020, hoffmann_2022], justification: "Ordre de grandeur choisi par nous ; relations 6ND/2N revérifiées dans Kaplan [V, ar5iv] ; « 20 tokens par paramètre » (Hoffmann) non énoncé tel quel et pertinence pour modèles à experts [NT] ; ce n'est pas une mesure."}
    central:
      {valeur: 1.0e+11, statut: H, source_ids: [kaplan_2020, hoffmann_2022], justification: "Ordre de grandeur choisi par nous ; relations 6ND/2N revérifiées dans Kaplan [V, ar5iv] ; « 20 tokens par paramètre » (Hoffmann) non énoncé tel quel et pertinence pour modèles à experts [NT] ; ce n'est pas une mesure."}
    high:
      {valeur: 3.0e+11, statut: H, source_ids: [kaplan_2020, hoffmann_2022], justification: "Ordre de grandeur choisi par nous ; relations 6ND/2N revérifiées dans Kaplan [V, ar5iv] ; « 20 tokens par paramètre » (Hoffmann) non énoncé tel quel et pertinence pour modèles à experts [NT] ; ce n'est pas une mesure."}

  Tokens_2024:
    unite: tokens/an
    description: "Tokens servis par an en 2024, monde (contrôle bottom-up)"
    low:
      {valeur: 1.0e+15, statut: H, source_ids: [openrouter], justification: "Ordre de grandeur choisi par nous ; contexte : OpenRouter (échantillon, aucune série lue) ; ce n'est pas une mesure."}
    central:
      {valeur: 1.0e+16, statut: H, source_ids: [openrouter], justification: "Ordre de grandeur choisi par nous ; contexte : OpenRouter (échantillon, aucune série lue) ; ce n'est pas une mesure."}
    high:
      {valeur: 1.0e+17, statut: H, source_ids: [openrouter], justification: "Ordre de grandeur choisi par nous ; contexte : OpenRouter (échantillon, aucune série lue) ; ce n'est pas une mesure."}

  eff_eff:
    unite: FLOP/J
    description: "Efficacité effective du parc, utilisation réelle comprise (contrôle bottom-up)"
    low:
      {valeur: 1.0e+11, statut: H, source_ids: [], justification: "Ordre de grandeur choisi par nous ; ce n'est pas une mesure."}
    central:
      {valeur: 3.0e+11, statut: H, source_ids: [], justification: "Ordre de grandeur choisi par nous ; ce n'est pas une mesure."}
    high:
      {valeur: 7.0e+11, statut: H, source_ids: [], justification: "Ordre de grandeur choisi par nous ; ce n'est pas une mesure."}

  # Carbone incorporé du matériel IT (sous-ensemble du scope 3), à part : hors scenarios.jeux et
  # hors Monte Carlo (le MC ne tire que les clés de scenarios.jeux). Jamais additionné au CO2e scope 2.
  r_s3:
    unite: "- (incorporé / CO2e scope 2 location-based, évalué à CI_ref)"
    description: "Carbone incorporé du matériel IT rapporté au CO2e scope 2 location-based à CI_ref ; l'intensité incorporée par kWh r_s3 x CI_ref est gardée constante (le matériel ne se décarbone pas avec le réseau)"
    low:
      valeur: 0.034
      statut: D
      source_ids: [morrison_2025]
      justification: "Morrison et al. : 22 tCO2e de fabrication pour un total « ≥ 493 t », donc opérationnel ≈ 471 t déduit, à 0,332 kg/kWh ; ramené à 458 g/kWh (CI_ref) : 22 / (471 x 458/332) = 22 / 650 ≈ 0,034. Le « ≥ » en fait un majorant du ratio pour CE cluster (22 t sur ≥ 493 t) ; il est retenu comme borne basse DU SECTEUR parce qu'il ne compte que les GPU (hors hôte, réseau, bâtiments), fabrication amortie sur 4 ans. Rattacher 0,332 kg/kWh (cluster Jupiter) à l'ensemble des 493 t est une hypothèse de notre part, non établie par la ref. Pas une mesure du parc mondial."
    central:
      {valeur: 0.05, statut: H, source_ids: [morrison_2025], justification: "Valeur choisie par nous, un peu au-dessus de la borne basse de Morrison (contexte) ; ce n'est pas une mesure. Les ratios hyperscalers publiés portent sur un dénominateur market-based et un périmètre scope 3 complet : non comparables. BLOOM : NT (intensité de son réseau absente des refs)."}
    high:
      {valeur: 0.15, statut: H, source_ids: [morrison_2025], justification: "Facteur choisi par nous : l'hôte (CPU, mémoire), le stockage, le réseau, le refroidissement et les bâtiments sont exclus des ACV de Morrison (GPU seuls). Le même ratio est appliqué au non-IA sans preuve (biais). Ce n'est pas une mesure."}

# Sens de chaque paramètre dans les scénarios (pessimiste = consommation haute).
scenarios:
  sens:
    g_conv: "Croissance plus forte du non-IA : consommation plus haute (pessimiste = high)."
    g_Ctrain_2025: "Compute d'entraînement croissant plus vite au départ : consommation plus haute (pessimiste = high)."
    g_Ctrain_2035: "Compute d'entraînement croissant plus vite à l'arrivée : consommation plus haute (pessimiste = high)."
    g_tok_2025: "Plus de tokens servis au départ : consommation plus haute (pessimiste = high)."
    g_tok_2035: "Plus de tokens servis à l'arrivée : consommation plus haute (pessimiste = high)."
    g_fpt_net: "Facteur net énergie-calcul par token plus haut (moins de gains logiciels) : consommation plus haute (pessimiste = high)."
    T_d_parc: "Doublement d'efficacité du parc plus lent (temps plus long) : consommation plus haute (pessimiste = high)."
    PUE_2035: "PUE final plus haut : énergie plus haute (pessimiste = high) ; à énergie égale l'eau sur site est plus basse (E/PUE)."
    WUE_site: "Plus d'eau consommée sur site par kWh IT : eau plus haute (pessimiste = high) ; sans effet sur TWh."
    EWIF: "Plus d'eau hors site par kWh : eau plus haute (pessimiste = high) ; sans effet sur TWh."
    d_CI: "Décarbonation plus lente (taux plus bas) : CO2e plus haut (pessimiste = low) ; sans effet sur TWh."
    s_AI: "Base 2024 : figé au central dans les trois scénarios (incertitude de mesure, réservée au Monte Carlo)."
    s_train: "Base 2024 : figé au central dans les trois scénarios (incertitude de mesure, réservée au Monte Carlo)."
    PUE_2024: "Base 2024 : figé au central dans les trois scénarios (seul le ratio PUE(t)/PUE_2024 agit)."
    E_DC0: "Ancrage 2024 : identique dans les trois scénarios."
    CI_ref: "Ancrage 2025 : identique dans les trois scénarios."
    annee_ref_CI: "Constante : identique dans les trois scénarios."
  jeux:
    pessimiste:
      g_conv: high
      g_Ctrain_2025: high
      g_Ctrain_2035: high
      g_tok_2025: high
      g_tok_2035: high
      g_fpt_net: high
      T_d_parc: high
      PUE_2035: high
      WUE_site: high
      EWIF: high
      d_CI: low
      s_AI: central
      s_train: central
      PUE_2024: central
      E_DC0: central
      CI_ref: central
      annee_ref_CI: central
    normal:

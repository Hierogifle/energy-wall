  CI_ref:
    unite: gCO2e/kWh
    description: "Intensité carbone moyenne du réseau mondial en année de référence (scope 2 location-based)"
    low:
      {valeur: 458, statut: V, source_ids: [ember_2025], justification: ""}
    central:
      {valeur: 458, statut: V, source_ids: [ember_2025], justification: ""}
    high:
      {valeur: 458, statut: V, source_ids: [ember_2025], justification: ""}

  annee_ref_CI:
    unite: année
    description: "Année de référence de CI_ref (CI(t) = CI_ref (1 - d_CI)^(t - annee_ref_CI))"
    low:
      {valeur: 2025, statut: V, source_ids: [ember_2025], justification: ""}
    central:
      {valeur: 2025, statut: V, source_ids: [ember_2025], justification: ""}
    high:
      {valeur: 2025, statut: V, source_ids: [ember_2025], justification: ""}

  d_CI:
    unite: taux/an
    description: "Décroissance annuelle de l'intensité carbone (taux)"
    low:
      {valeur: 0.005, statut: H, source_ids: [], justification: "Aucune source ; borne choisie sous la tendance observée (~1,5 %/an). Ce n'est pas une mesure."}
    central:
      valeur: 0.015
      statut: D
      source_ids: [ember_2025]
      justification: "Ember : 533 gCO2e/kWh (2015) -> 458 (2025), soit (458/533)^(1/10) - 1 ≈ -1,5 %/an."
    high:
      {valeur: 0.03, statut: H, source_ids: [ember_2025], justification: "Repère : Ember donne -2,7 % en 2025 (une seule année) ; la borne 3 % est choisie au-dessus, sans dérivation. Ce n'est pas une mesure."}

  WUE_site:
    unite: L/kWh IT
    description: "Eau consommée sur site par kWh d'énergie IT"
    low:
      valeur: 0.1
      statut: D
      source_ids: [arxiv_2606_21760]
      justification: "Hyperscale par 15 zones climatiques US : 0,09-1,80 L/kWh (préprint, table de synthèse) ; 0,09 arrondi à 0,1."
    central:
      valeur: 1.0
      statut: V
      source_ids: [ren_2023]
      justification: "Ren et al. : 1 L/kWh, moyenne annualisée Google selon le papier (valeur lue, préprint) ; Pas un recoupement indépendant : le 0,26 mL de Google 2025 vient d'un WUE fixe de 1,15 L/kWh appliqué à l'énergie hors surcharge (non mesuré)."
    high:
      valeur: 2.0
      statut: H
      source_ids: [arxiv_2606_21760]
      justification: "Tronquée à 2,0 : la plage évaporative seule est 1,99-4,00 L/kWh (préprint) ; l'hypothèse d'un parc mixte justifiant cette troncature n'est pas sourcée."

  EWIF:
    unite: L/kWh
    description: "Eau consommée hors site par kWh électrique (intensité hydrique de l'électricité)"
    low:
      valeur: 1.29
      statut: V
      source_ids: [morrison_2025]
      justification: "Cluster Jupiter (Texas, Austin Energy), hors site 1,29 L/kWh, lu : hypothèse du papier d'après Reig et al. 2020 (WRI), pas une mesure ; valeur régionale, pas du monde. Même origine (WRI) que la borne haute (ren_2023) : bornes non indépendantes."
    central:
      valeur: 1.6
      statut: H
      source_ids: []
      justification: "Aucune valeur monde ni France trouvée (H structurelle) ; valeur choisie entre les deux bornes lues (Texas, moyenne États-Unis), toutes deux issues de WRI (Reig et al. 2020)."
    high:
      valeur: 3.14
      statut: V
      source_ids: [ren_2023]
      justification: "Moyenne États-Unis, consommation, 3,14 L/kWh (lu), d'après Reig et al. 2020 (WRI), année non précisée ; valeur d'un pays, pas du monde. Même origine (WRI) que la borne basse (morrison_2025) : bornes non indépendantes."

  # Contrôle bottom-up 2024 (hors scénarios, affiché, non utilisé par la projection).
  C_train_2024:

    low:
      {valeur: 1.2, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    central:
      {valeur: 1.3, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    high:
      {valeur: 1.35, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}

  g_fpt_net:
    unite: facteur/an
    description: "Facteur annuel net de l'énergie-calcul par token (FLOP/token ~2N_actif et gains logiciels hors matériel fusionnés)"
    low:
      {valeur: 0.97, statut: H, source_ids: [], justification: "Aucune source (relation 2N de Kaplan revérifiée [V, ar5iv] mais ignore le terme de contexte ; gains logiciels non sourcés). Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    central:
      {valeur: 1.0, statut: H, source_ids: [], justification: "Aucune source (relation 2N de Kaplan revérifiée [V, ar5iv] mais ignore le terme de contexte ; gains logiciels non sourcés). Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    high:
      {valeur: 1.02, statut: H, source_ids: [], justification: "Aucune source (relation 2N de Kaplan revérifiée [V, ar5iv] mais ignore le terme de contexte ; gains logiciels non sourcés). Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}

  T_d_parc:
    unite: ans
    description: "Temps de doublement de l'efficacité FLOP/J du PARC installé (> matériel de pointe)"
    low:
      valeur: 2.5
      statut: H
      source_ids: [bloom, morrison_2025]
      justification: "Contexte : renouvellement du parc sur 3-6 ans (BLOOM 6 ans, Morrison 4 ans), donc plus lent que le matériel de pointe (Epoch 1,7-3 ans). Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."
    central:
      valeur: 2.8
      statut: H
      source_ids: [bloom, morrison_2025]
      justification: "Absent des refs ; même contexte de renouvellement du parc. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."
    high:
      valeur: 3.0
      statut: D
      source_ids: [epoch]
      justification: "Borne haute de l'intervalle de doublement du matériel de pointe d'Epoch (1,7-3 ans, statut S, valeurs divergentes selon la version) ; le parc installé est supposé au mieux aussi lent. Simplification : exposant constant, pas un vrai retard de renouvellement."

  PUE_2035:
    unite: "-"
    description: "PUE moyen du parc en 2035 (PUE linéaire entre 2024 et 2035)"
    low:
      {valeur: 1.2, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    central:
      {valeur: 1.25, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}
    high:
      {valeur: 1.3, statut: H, source_ids: [], justification: "Aucune source. Plage choisie par nous pour encadrer des trajectoires d'ordre de grandeur comparable aux scénarios IEA 2035 ; ce n'est pas une mesure."}

  g_cap:
    unite: taux/an
    description: "Croissance annuelle de la capacité d'alimentation (stress test du mur, hors scénarios)"
    low:
      {valeur: 0.08, statut: H, source_ids: [cso_irlande], justification: "Illustration : CSO Irlande +10 %/an en 2023-2024 (lu) ; l'interprétation « contrainte réseau » n'est pas vérifiée. Plage choisie par nous ; ce n'est pas une mesure."}
    central:
      {valeur: 0.12, statut: H, source_ids: [cso_irlande], justification: "Illustration : CSO Irlande +10 %/an en 2023-2024 (lu) ; l'interprétation « contrainte réseau » n'est pas vérifiée. Plage choisie par nous ; ce n'est pas une mesure."}
    high:

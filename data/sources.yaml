      - {description: "Entrées de projection = projections industrielles de livraisons de serveurs ; sens non établi (de Vries la juge trop basse sur l'IA ; Koomey met en garde contre la surestimation par les développeurs, mais cela concerne les demandes de raccordement)", sens: indetermine, grandeur: "cibles IEA 2030-2035"}

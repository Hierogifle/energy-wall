    date_publication: "2025-04"
    date_consultation: 2026-10-14
    version: null
    periode_donnees: "2024 (415 TWh) ; 2030 Base (945 TWh) ; 2035 par scénario"
    licence: "CC BY 4.0 (page/PDF) ; fichiers du data explorer : licence non vérifiée"
    perimetre: "Consommation électrique des datacenters, monde (US 45 %, Chine 25 %, Europe 15 % en 2024) ; période annuelle"
    methode: modelisation
    interet: "Agence intergouvernementale (32 membres) ; financement NT (non documenté) ; entrées de projection = livraisons de serveurs annoncées par l'industrie [V]"
    biais:
      - {description: "Incertitude substantielle sur la consommation actuelle, reconnue par l'IEA sans intervalle ; historique de révisions entre éditions (Electricity 2024 : 460 TWh en 2022 avec crypto ; Shift cite 200 à 460 TWh entre deux publications)", sens: indetermine, grandeur: "E_DC0 (415 TWh, 2024)"}

  - id: iea4e_2025
    titre: "Data Centre Energy Use: Critical Review of Models and Results (IEA-4E, mars 2025 sur la couverture ; « mai 2025 » = date du dossier d'upload)"
    organisation: IEA-4E
    type_acteur: agence_publique
    type_acteur_qualifie: false
    url: https://www.iea-4e.org/wp-content/uploads/2025/05/Data-Centre-Energy-Use-Critical-Review-of-Models-and-Results.pdf
    url_relais: https://www.iea-4e.org/edna/publications/data-centre-energy-use-critical-review-of-models-and-results/
    statut_lecture: lu_source
    date_publication: "2025-03"
    date_consultation: 2026-10-16
    version: null
    periode_donnees: "Dispersion de la littérature sur les datacenters au total : 2020 de moins de 200 à 1 200 TWh ; 2030 de 210 à 7 900 TWh, facteur ~40 [V, p. iv, p. 12] ; monde 2023 : 300-380 TWh hors crypto [V, p. v] ; IA 2023 : « 10-50 TWh » (5-15 % de la consommation des datacenters) et projection de la littérature 200-900 TWh en 2030 [V, p. vi] ; part entraînement 20-40 % de l'énergie ML, données Meta/Google <= 2022 [V, p. 29] ; croissance mondiale depuis 2018 : +50-80 %, soit 8-13 %/an [V, p. 43]"
    licence: inconnue
    perimetre: "Revue critique (plus de 100 sources, plus de 200 scénarios, 2010-2040 [S], non relevé dans la lecture du PDF) des modèles de consommation des datacenters au total, hors crypto pour les chiffres monde ; pas de l'IA seule ; PDF de 72 pages lu en entier par nous (pagination imprimée citée) ; les chiffres de tiers (Meta, Google, LBNL, IEA 2024a) sont repris via la revue : [S] pour eux"
    methode: estimation_secondaire
    interet: "Rapport commandé par la plateforme EDNA du 4E TCP (programme de collaboration « sous les auspices de l'IEA », juridiquement autonome ; 14 pays et la Commission européenne) à deux auteurs, George Kamiya (expert indépendant, Royaume-Uni) et Vlad Coroamă (Roegen Centre for Sustainability, Suisse) ; vues propres aux auteurs [V, p. 2 de couverture, p. i] ; montant et conditions du financement NT (non indiqués dans le PDF) ; type_acteur agence_publique = valeur d'enum la plus proche, discutable (programme de collaboration d'agence, auteurs indépendants mandatés : inférence)"
    biais:
      - {description: "Qualité des études notée subjectivement par les deux auteurs, échelle 1-6, par consensus (p. 11) : le classement « faible/élevée » dépend de leur jugement, sans critère externe", sens: indetermine, grandeur: s_AI}
      - {description: "10-50 TWh concerne 2023, pas 2024 (p. vi) ; la part de 5-15 % de la littérature diffère de la part de 10-15 % des auteurs (30-50 TWh en 2023, p. 43) ; année 2023 appliquée à 2024 = dérivation", sens: indetermine, grandeur: s_AI}
      - {description: "Dispersion ~40x (210 à 7 900 TWh en 2030) relevée pour les datacenters au total (p. iv, p. 12) ; sans direction de biais", sens: indetermine, grandeur: "consommation 2030"}
      - {description: "Part d'entraînement 20-40 % tirée de données Meta (Wu et al. 2022) et Google (Patterson et al. 2022), années <= 2022 (p. 29), lues via la revue [S] ; appliquée au monde 2024 = dérivation", sens: indetermine, grandeur: s_train}
      - {description: "Taux 8-13 %/an depuis 2018 : fourchette des auteurs sur le monde hors crypto (p. 43), pas une série annuelle ; dépend des niveaux 2018 et 2023 retenus par les auteurs", sens: indetermine, grandeur: "taux observé 2018-2023"}
    utilise_pour: [s_AI, s_train]


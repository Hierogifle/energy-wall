[project]
name = "energywall"
version = "0.1.0"
description = "Projection 2024-2035 de la consommation electrique des datacenters / IA"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupytext",
    "ipykernel",
    "nbconvert",
    "nbstripout>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energywall"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
